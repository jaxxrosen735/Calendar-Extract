<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toronto Theatre Screenings</title>
    <link rel="stylesheet" href="/static/style.css">
    <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js" 
    integrity="sha512-0izBc1upGYnrS1u1MX7QR+sjFIxZWxLVdNI7cUoHHCutDr5ENjuQRZuS+v+3NFNGfwHSrPoHzBzED0rV651tGw==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
</script>

<script>
    if (typeof ICAL === 'undefined') {
        document.write('<script src="/static/ical.min.js"><\/script>');
        console.warn("CDN failed or SRI mismatch. Falling back to local ical.min.js");
    }
</script>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>CALENDAR_MANAGER.EXE</span>
        <span>X</span>
    </div>
    
    <div class="content">
        <marquee scrollamount="3">Theater Screentimes</marquee>
        
        <p><b>Management Console:</b></p>
        <div id="calendar-container">
            <div id="calendar-header">
                <button onclick="changeMonth(-1)">&lt; PREV</button>
                <b id="current-month-display">MONTH 202X</b>
                <button onclick="changeMonth(1)">NEXT &gt;</button>
            </div>
            <table id="calendar-table" border="1" width="100%">
                <!-- Calendar cells will show event time and title, handled by app.js -->
                </table>
        </div>

        <p>Terminal Output:</p>
        <div class="status-box" id="logs">
            <div>[00:00:00] Initializing boot sequence...</div>
        </div>
    </div>
</div>
<div id="event-modal" class="window popup" style="display: none; position: fixed; z-index: 999; width: 300px;">
    <div class="title-bar">
        <span id="modal-title">EVENT_DETAILS.TXT</span>
        <button onclick="closeModal()" style="font-size: 10px; padding: 0 4px;">X</button>
    </div>
    <div class="content" style="background: #fff; border: 2px inset #fff; margin: 5px; min-height: 100px;">
        <p id="modal-desc" style="font-size: 11px; margin: 0; padding: 5px; color: #000; white-space: pre-wrap;"></p>
        <!-- Event details (time, location, description) are injected by app.js -->
    </div>
    <div style="text-align: center; padding-bottom: 5px;">
        <button onclick="closeModal()">OK</button>
    </div>
</div>

<div id="modal-overlay" onclick="closeModal()" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.2); z-index: 998;"></div>
<script src="/static/app.js"></script>
</body>
</html>
